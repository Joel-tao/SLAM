<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="640" viewBox="0 0 1000 640"><rect width="100%" height="100%" fill="#fff"/><g font-family="Arial, sans-serif" fill="#172b40"><text x="55" y="49" font-size="28" font-weight="700">From simulation to mapping and localization</text><rect x="55" y="90" width="890" height="74" rx="12" fill="#f3f6f9" stroke="#cbd5e1"/><text x="80" y="119" font-size="20" font-weight="700">Gazebo  |  Generate the robot experiment</text><text x="80" y="145" font-size="16" fill="#475569">Robot motion, LiDAR, odometry and a shared simulation clock.</text><path d="M500 167v18m-5-5 5 5 5-5" fill="none" stroke="#49657d" stroke-width="2"/><rect x="55" y="190" width="890" height="74" rx="12" fill="#edf4fa" stroke="#cbd5e1"/><text x="80" y="219" font-size="20" font-weight="700">ROS 2  |  Connect the data</text><text x="80" y="245" font-size="16" fill="#475569">Topics carry scans and poses; TF relates sensor, robot and world frames.</text><path d="M500 267v18m-5-5 5 5 5-5" fill="none" stroke="#49657d" stroke-width="2"/><rect x="55" y="290" width="890" height="74" rx="12" fill="#f3f6f9" stroke="#cbd5e1"/><text x="80" y="319" font-size="20" font-weight="700">SLAM Toolbox  |  Build the map</text><text x="80" y="345" font-size="16" fill="#475569">Estimate the trajectory and occupancy map; save the map for later use.</text><path d="M500 367v18m-5-5 5 5 5-5" fill="none" stroke="#49657d" stroke-width="2"/><rect x="55" y="390" width="890" height="74" rx="12" fill="#edf4fa" stroke="#cbd5e1"/><text x="80" y="419" font-size="20" font-weight="700">AMCL + Nav2  |  Localize and navigate</text><text x="80" y="445" font-size="16" fill="#475569">Load the saved map, set an initial pose and evaluate goal-directed motion.</text><path d="M500 467v18m-5-5 5 5 5-5" fill="none" stroke="#49657d" stroke-width="2"/><rect x="55" y="490" width="890" height="74" rx="12" fill="#f3f6f9" stroke="#cbd5e1"/><text x="80" y="519" font-size="20" font-weight="700">RViz  |  Inspect every stage</text><text x="80" y="545" font-size="16" fill="#475569">Visualize sensor data, TF, trajectories, the map and navigation goals.</text><text x="55" y="620" font-size="15" fill="#526477">Planned integration. RViz observes the running system across all stages.</text></g></svg>