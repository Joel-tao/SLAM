<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="640" viewBox="0 0 1000 640"><rect width="100%" height="100%" fill="#fff"/><g font-family="Arial, sans-serif" fill="#172b40"><text x="55" y="49" font-size="28" font-weight="700">How the current localization experiment works</text><rect x="55" y="90" width="890" height="74" rx="12" fill="#f3f6f9" stroke="#cbd5e1"/><text x="80" y="119" font-size="20" font-weight="700">1  Measure motion and geometry</text><text x="80" y="145" font-size="16" fill="#475569">Noisy odometry predicts motion; simulated LiDAR measures visible surfaces.</text><path d="M500 167v18m-5-5 5 5 5-5" fill="none" stroke="#49657d" stroke-width="2"/><rect x="55" y="190" width="890" height="74" rx="12" fill="#edf4fa" stroke="#cbd5e1"/><text x="80" y="219" font-size="20" font-weight="700">2  Predict the robot pose</text><text x="80" y="245" font-size="16" fill="#475569">Compose the previous SE(2) pose with the measured relative motion.</text><path d="M500 267v18m-5-5 5 5 5-5" fill="none" stroke="#49657d" stroke-width="2"/><rect x="55" y="290" width="890" height="74" rx="12" fill="#f3f6f9" stroke="#cbd5e1"/><text x="80" y="319" font-size="20" font-weight="700">3  Match the scan to the map</text><text x="80" y="345" font-size="16" fill="#475569">Nearest neighbors, correspondence gating and trimming feed rigid ICP alignment.</text><path d="M500 367v18m-5-5 5 5 5-5" fill="none" stroke="#49657d" stroke-width="2"/><rect x="55" y="390" width="890" height="74" rx="12" fill="#edf4fa" stroke="#cbd5e1"/><text x="80" y="419" font-size="20" font-weight="700">4  Update the trajectory and map</text><text x="80" y="445" font-size="16" fill="#475569">Accepted scans extend the endpoint map; rejected scans fall back to odometry.</text><path d="M500 467v18m-5-5 5 5 5-5" fill="none" stroke="#49657d" stroke-width="2"/><rect x="55" y="490" width="890" height="74" rx="12" fill="#f3f6f9" stroke="#cbd5e1"/><text x="80" y="519" font-size="20" font-weight="700">5  Detect persistent change</text><text x="80" y="545" font-size="16" fill="#475569">Compare observations with the frozen baseline and accumulate repeated evidence.</text><text x="55" y="620" font-size="15" fill="#526477">Conceptual diagram of the Python experiment. Ground truth is used for evaluation.</text></g></svg>